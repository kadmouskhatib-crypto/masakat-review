<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>موقع المساقات</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@700;800&family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap">
<style>
:root{--bg:#120E0F;--panel:#1E1719;--fg:#F6F1F1;--muted:#B9ADB0;--line:#3A2E31;--red:#C8102E}
*{box-sizing:border-box}html,body{min-height:100%}
body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));background:radial-gradient(circle at 50% 18%,#3b0b15 0,var(--bg) 58%);color:var(--fg);font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif}
form{width:min(400px,100%);display:grid;gap:14px;padding:30px 24px;background:var(--panel);border:1px solid var(--line);border-radius:20px;text-align:center;box-shadow:0 24px 60px rgb(0 0 0 / .45);animation:in .6s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:.001;transform:translateY(18px)}}
form img{width:88px;height:88px;margin:0 auto;border-radius:50%;background:#fff;animation:spin 1s cubic-bezier(.2,.8,.2,1)}
@keyframes spin{from{transform:rotate(-120deg) scale(.8)}}
h1{margin:4px 0 0;font:800 30px/1.3 Alexandria,"IBM Plex Sans Arabic",Tahoma,sans-serif}p{margin:0;color:var(--muted);font-size:14px;line-height:1.7}
label{text-align:right;font-weight:600;font-size:14px}
input{width:100%;height:50px;margin-top:6px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:#fff;color:#1A1416;font:inherit;font-size:16px;direction:ltr;text-align:left}
input:focus{outline:2px solid var(--red);outline-offset:1px}
button{height:50px;border:0;border-radius:12px;background:var(--red);color:#fff;font:inherit;font-weight:700;font-size:16px;cursor:pointer;transition:filter .2s,transform .2s}button:hover{filter:brightness(1.1);transform:translateY(-1px)}button:disabled{opacity:.65;cursor:wait;transform:none}
#msg{min-height:22px;color:#FF8A9A;font-size:14px;font-weight:600}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<form id="f" autocomplete="off">
  <img src="logo.png" alt="الشعار">
  <h1>موقع المساقات</h1>
  <p>نسخة خاصة بالمراجعة. أدخل كلمة المرور للمتابعة.</p>
  <label for="pw">كلمة المرور<input id="pw" type="password" required autofocus></label>
  <button id="go" type="submit">دخول</button>
  <div id="msg" role="alert"></div>
</form>
<script>
(() => {
const $ = id => document.getElementById(id), te = new TextEncoder(), td = new TextDecoder();
const hex = s => Uint8Array.from(s.match(/../g), x => parseInt(x, 16));
const nativeFetch = window.fetch.bind(window);
const PIXEL = 'data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==';

function idb(mode, fn) {
  return new Promise((ok, no) => {
    const open = indexedDB.open('masakat-review', 1);
    open.onupgradeneeded = () => open.result.createObjectStore('kv');
    open.onerror = () => no(open.error);
    open.onsuccess = () => {
      const tx = open.result.transaction('kv', mode), req = fn(tx.objectStore('kv'));
      tx.oncomplete = () => { open.result.close(); ok(req.result); };
      tx.onerror = () => no(tx.error);
    };
  });
}
const open = (key, buf, label) => crypto.subtle.decrypt({ name: 'AES-GCM', iv: buf.slice(0, 12), additionalData: te.encode(label) }, key, buf.slice(12));
async function loadManifest(key) {
  const r = await nativeFetch('e/m.bin', { cache: 'no-cache' });
  if (!r.ok) throw new Error('network');
  const b = await r.arrayBuffer();
  let plain;
  try { plain = await open(key, b, 'manifest'); } catch { throw new Error('password'); }
  return JSON.parse(td.decode(plain));
}

/* Runs the decrypted app in this page. */
async function start(key, manifest) {
  const bytes = async path => {
    const item = manifest[path]; if (!item) throw new Error('missing');
    const r = await nativeFetch('e/' + item.h); if (!r.ok) throw new Error('network');
    return open(key, await r.arrayBuffer(), path);
  };
  const urls = {};
  const assetUrl = path => urls[path] ||= bytes(path).then(b => URL.createObjectURL(new Blob([b], { type: manifest[path].t })));
  window.__assetUrl = assetUrl;
  window.fetch = (input, opts) => {
    const path = typeof input === 'string' ? input.replace(/^\.\//, '').split(/[?#]/)[0] : '';
    if (!manifest[path]) return nativeFetch(input, opts);
    return bytes(path).then(b => new Response(b, { status: 200, headers: { 'Content-Type': manifest[path].t } }))
      .catch(() => new Response('', { status: 503 }));
  };
  const rewrite = html => String(html)
    .replace(/src="((?:img|di|pg)\/[^"]+)"/g, `src="${PIXEL}" data-esrc="$1"`)
    .replace(/style="background-image:url\('((?:img|di|pg)\/[^']+)'\)"/g, 'data-ebg="$1"');
  const inner = Object.getOwnPropertyDescriptor(Element.prototype, 'innerHTML');
  Object.defineProperty(Element.prototype, 'innerHTML', { configurable: true, get() { return inner.get.call(this); }, set(v) { inner.set.call(this, rewrite(v)); } });

  let active = 0; const queue = [];
  const pump = () => {
    while (active < 5 && queue.length) {
      const el = queue.shift(); active++;
      const path = el.dataset.esrc || el.dataset.ebg;
      assetUrl(path).then(u => { if (el.dataset.esrc) el.src = u; else el.style.backgroundImage = `url("${u}")`; })
        .catch(() => {}).finally(() => { active--; pump(); });
    }
  };
  const hydrate = node => {
    if (node.nodeType !== 1) return;
    const list = node.matches('[data-esrc],[data-ebg]') ? [node] : [];
    list.push(...node.querySelectorAll('[data-esrc],[data-ebg]'));
    list.forEach(el => { if (!el._seen) { el._seen = 1; queue.push(el); } });
    pump();
  };
  const scripts = {};
  let page = td.decode(await bytes('index.html'));
  for (const m of page.matchAll(/<script src="([^"]+)"/g)) if (manifest[m[1]]) scripts[m[1]] = await assetUrl(m[1]);
  for (const [p, u] of Object.entries(scripts)) page = page.replace(`<script src="${p}"`, `<script src="${u}"`);
  page = page.replace(/<link rel="icon" href="[^"]*">/, '<link rel="icon" href="logo.png">');
  page = '<!doctype html><html lang="ar" dir="rtl"><head><meta name="robots" content="noindex,nofollow"></head><body>' + rewrite(page) + '</body></html>';
  document.open();
  new MutationObserver(all => all.forEach(x => x.addedNodes.forEach(hydrate))).observe(document, { childList: true, subtree: true });
  document.write(page);
  document.close();
  hydrate(document.documentElement);
}

(async () => {
  if (!crypto.subtle) { $('msg').textContent = 'افتح الرابط عبر https في متصفح حديث.'; $('go').disabled = true; return; }
  try {
    const k = await idb('readonly', s => s.get('key'));
    if (k) {
      try { await start(k, await loadManifest(k)); }
      catch (e) { if (e.message === 'password') await idb('readwrite', s => s.delete('key')); }
    }
  } catch {}
})();

$('f').addEventListener('submit', async e => {
  e.preventDefault(); $('msg').textContent = ''; $('go').disabled = true; $('go').textContent = 'جارٍ الفتح…';
  try {
    const cfg = await (await nativeFetch('config.json', { cache: 'no-cache' })).json();
    const base = await crypto.subtle.importKey('raw', te.encode($('pw').value.trim()), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt: hex(cfg.salt), iterations: cfg.iter }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const manifest = await loadManifest(key);
    try { await idb('readwrite', s => s.put(key, 'key')); } catch {}
    await start(key, manifest);
  } catch (x) {
    $('msg').textContent = x.message === 'password' ? 'كلمة المرور غير صحيحة.' : 'تعذّر الفتح. تأكد من الاتصال بالإنترنت وحاول مجدداً.';
    $('pw').select(); $('go').disabled = false; $('go').textContent = 'دخول';
  }
});
})();
</script>
</body>
</html>
